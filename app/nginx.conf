server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite hashed assets — long cache
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # WhatsApp “Contact care” button lands here (must not fall through to the SPA)
  location = /care {
    try_files /care/index.html =404;
  }
  location /care/ {
    try_files $uri $uri/ =404;
  }

  # SPA: React Router falls back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
