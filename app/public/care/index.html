<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>N.I SMILE Customer Care</title>
    <style>
      :root {
        --ink: #1a2b33;
        --muted: #5a6b73;
        --bg: #f3f7f8;
        --card: #ffffff;
        --accent: #0d7a8c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, #d9eef2 0%, transparent 45%),
          radial-gradient(circle at bottom right, #e8f4f6 0%, transparent 40%),
          var(--bg);
      }
      main {
        width: min(100%, 420px);
        padding: 32px 28px;
        background: var(--card);
        border-radius: 16px;
        box-shadow: 0 12px 40px rgba(26, 43, 51, 0.08);
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
        font-weight: 700;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.45;
      }
      .cta {
        display: block;
        width: 100%;
        padding: 18px 22px;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        font-size: 1.35rem;
        letter-spacing: 0.02em;
        line-height: 1.35;
        -webkit-user-select: text;
        user-select: text;
      }
      .cta small {
        display: block;
        margin-top: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        opacity: 0.92;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>N.I SMILE Customer Care</h1>
      <p>Tap the number for Chat or Call — same as the number on the message.</p>
      <div class="cta">+252 63 4548732<small>Customer care · Chat or Call</small></div>
    </main>
  </body>
</html>
